# daimon 配置示例（个人 Agent；请勿在其中写入真实密钥）。
#
# 安全约定：
#  - 真实 API Key 一律通过环境变量（api_key_env）注入，多个 key 用英文逗号分隔；
#  - 这里仅保留 api_key_env 的变量名，绝不内联密钥；
#  - 复制为 config.yaml 并 `export AGNES_API_KEYS="k1,k2,k3"` 后使用：
#      cp config.example.yaml config.yaml && export AGNES_API_KEYS="k1,k2,k3"
#      npx tsx src/cli.ts --config config.yaml list-providers
#      npx tsx src/cli.ts --config config.yaml chat --prompt "你好"

default_provider: agnes
log_level: INFO

providers:
  # ---------------- Agnes AI（OpenAI 兼容，多模态免费服务） ----------------
  agnes:
    enabled: true
    base_url: "https://api.agnes-ai.cn/v1"
    api_key_env: AGNES_API_KEYS          # 形如: export AGNES_API_KEYS="key1,key2,key3"
    keys: []                             # 留空，使用环境变量；本地调试可临时填
    cooldown_seconds: 60                 # 限流冷却时长
    round_robin: false                   # false=主 key 优先，额度耗尽再轮换
    max_failures: 3                      # 连续失败达到该次数判定 key 失效
    default_models:
      text: agnes-text-free              # TODO: 以 Agnes 控制台实际免费模型名为准
      image: agnes-image                 # 免费图像模型（既有项目经验）
      video: agnes-video-new-flash       # 免费视频模型（既有项目经验）
      audio: agnes-tts-free              # TODO: 以 Agnes 控制台实际免费模型名为准
      multimodal: agnes-text-free        # TODO: 以 Agnes 控制台实际免费模型名为准
    extra:
      # 视频：异步提交 + 轮询（端点/字段需按官方文档核实后微调）
      video_endpoint: "/videos/generations"
      video_poll_endpoint: "/videos/{id}"
      video_timeout: 600
      video_poll_interval: 5
      # 音频：TTS
      audio_endpoint: "/audio/speech"

  # ---------------- edge-tts（微软免费 TTS，无需 Key） ----------------
  edge-tts:
    enabled: true
    keys: []
    default_models:
      audio: zh-CN-XiaoxiaoNeural
